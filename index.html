async function viewFriends(){
 const[a,b,fo]=await Promise.all([sb.from("profiles").select("id,name,country,avatar_url").neq("id",me.id).order("name").limit(200),sb.from("friendships").select("*"),sb.from("follows").select("*")]);
 if(a.error)throw a.error;if(b.error)throw b.error;
 const rel=id=>{const f=b.data.find(x=>x.requester===id||x.receiver===id);if(!f)return{s:"none"};
  if(f.status==="accepted")return{s:"friend",f};return f.requester===me.id?{s:"sent",f}:{s:"received",f}};
 const row=(p,r)=>`<div class="card row">${av(p.name,p.avatar_url)}<div class="grow"><b>${esc(p.name)}</b><div class="mute">${esc(p.country)}</div></div>${r}${(()=>{const y=fo.data?.some(x=>x.follower===me.id&&x.followed===p.id);return `<button class="ghost ${y?"on":""}" data-act="${y?"unfollow":"follow"}" data-id="${p.id}">${y?"Suivi":"Suivre"}</button>`})()}</div>`;
 const L={friend:[],received:[],other:[]};
 a.data.forEach(p=>{const r=rel(p.id);(r.s==="friend"?L.friend:r.s==="received"?L.received:L.other).push([p,r])});
 const btn=([p,r])=>r.s==="friend"?`<button data-act="chat" data-id="${p.id}" data-name="${esc(p.name)}">Message</button>`:r.s==="received"?`<button data-act="accept" data-id="${r.f.id}">Accepter</button>`:r.s==="sent"?`<button class="ghost" disabled>Demande envoyée</button>`:`<button data-act="add" data-id="${p.id}">Ajouter</button>`;
 return (L.received.length?`<h2>Demandes reçues</h2>`+L.received.map(x=>row(x[0],btn(x))).join(""):"")+
 `<h2>${tr("Mes amis ({0})",L.friend.length)}</h2>`+(L.friend.length?L.friend.map(x=>row(x[0],btn(x))).join(""):`<p class="mute">Tu n’as pas encore d’amis. Envoie une demande ci-dessous.</p>`)+
 `<h2>Personnes à découvrir</h2>`+(L.other.length?L.other.map(x=>row(x[0],btn(x))).join(""):`<p class="mute">Personne d’autre n’est inscrit pour l’instant. Invite tes proches à rejoindre Freebook !</p>`);
}
async function viewAds(){
 const{data,error}=await sb.from("ads").select("id,category,title,body,image_url,created_at,author,profiles!author(name,country,avatar_url)").order("created_at",{ascending:false}).limit(50);
 if(error)throw error;
 return `<div class="card"><input id="at" maxlength="70" placeholder="Titre de l’annonce" aria-label="Titre"><textarea id="ab" maxlength="500" placeholder="Décris ton annonce" aria-label="Texte"></textarea><select id="ac" aria-label="Catégorie"><option value="Emploi">Emploi</option><option value="Événement">Événement</option><option value="À vendre">À vendre</option><option value="Service">Service</option><option value="Autre">Autre</option></select><input id="ap" type="file" accept="image/*" aria-label="Photo"><button data-act="ad">Publier l’annonce</button></div>`+
 data.map(a=>`<article class="card"><span class="tag">${esc(a.category)}</span><h3 style="margin:8px 0 2px">${esc(a.title)}</h3><p class="text">${esc(a.body)}</p>${a.image_url?`<img class="pic" src="${esc(a.image_url)}" alt="">`:""}<div class="mute">${esc(a.profiles?.name)} · ${esc(a.profiles?.country)} · ${fmt(a.created_at)}${a.author===me.id?` · <button class="link" data-act="delad" data-id="${a.id}">Supprimer</button>`:""}</div></article>`).join("");
}
async function myFriends(){
 const{data,error}=await sb.from("friendships").select("requester,receiver").eq("status","accepted");
 if(error)throw error;
 const ids=data.map(f=>f.requester===me.id?f.receiver:f.requester);
 if(!ids.length)return[];
 const r=await sb.from("profiles").select("id,name,country,avatar_url").in("id",ids).order("name");
 if(r.error)throw r.error;return r.data;
}
async function viewChatList(){
 const fr=await myFriends();
 return `<h2>Messages</h2>`+(fr.length?fr.map(p=>`<div class="card row">${av(p.name,p.avatar_url)}<div class="grow"><b>${esc(p.name)}</b><div class="mute">${esc(p.country)}</div></div><button data-act="chat" data-id="${p.id}" data-name="${esc(p.name)}">Écrire</button></div>`).join(""):`<p class="mute">Tu peux écrire et appeler tes amis. Ajoute-en dans l’onglet Amis.</p>`);
}
async function viewChat(){
 const q=`and(sender.eq.${me.id},receiver.eq.${chat.id}),and(sender.eq.${chat.id},receiver.eq.${me.id})`;
 const{data,error}=await sb.from("messages").select("*").or(q).order("created_at",{ascending:true}).limit(200);
 if(error)throw error;
 const list=data.map(m=>{const mine=m.sender===me.id;
  const body=m.kind==="call"?`📞 ${m.body==="Appel audio"?(mine?"Tu as lancé un appel audio":"Appel audio de "+esc(chat.name)):(mine?tr("Tu as lancé un appel vidéo"):tr("Appel vidéo de {0}",esc(chat.name)))}<br><button data-act="join" data-audio="${m.body==="Appel audio"}" data-room="${esc(m.room)}">Rejoindre l’appel</button>`:esc(m.body);
  return `<div class="bub ${mine?"me":""}">${body}<small>${fmt(m.created_at)}</small></div>`}).join("");
 return `<div class="row"><button class="ghost" data-act="back">←</button><div class="grow"><b>${esc(chat.name)}</b></div><button data-act="acall">🎧 Audio</button><button data-act="call">📹 Vidéo</button></div>
 <div id="msgs">${list||`<p class="mute">Aucun message. Dis bonjour !</p>`}</div>
 <textarea id="mi" maxlength="1000" placeholder="Ton message…" aria-label="Message"></textarea><button data-act="send">Envoyer</button>`;
}
async function viewMe(){
 const[f,p,fw,fg]=await Promise.all([myFriends(),sb.from("posts").select("id",{count:"exact",head:true}).eq("author",me.id),sb.from("follows").select("*",{count:"exact",head:true}).eq("followed",me.id),sb.from("follows").select("*",{count:"exact",head:true}).eq("follower",me.id)]);
 return `<div class="card"><div class="row">${av(me.name,me.avatar_url)}<div class="grow"><b>${esc(me.name)}</b><div class="mute">${esc(me.country)} · ${tr("{0} amis · {1} statuts",f.length,p.count||0)} · ${fw.count||0} abonnés · ${fg.count||0} abonnements</div><div class="mute">Membre depuis le ${fday(me.created_at)}${me.birth_date?" · Né(e) le "+fday(me.birth_date):""}${me.gender?" · "+(me.gender==="F"?"Femme":"Homme"):""}</div></div></div></div>
 <div class="card"><h2 style="margin-top:0">Modifier mon profil</h2>${langSel()}<label class="mute" for="en">Nom</label><input id="en" maxlength="40" value="${esc(me.name)}"><label class="mute" for="ec">Pays</label><select id="ec">${COUNTRIES.map(c=>`<option value="${c}" ${c===me.country?"selected":""}>${c}</option>`).join("")}</select><label class="mute" for="ep">Photo de profil</label><input id="ep" type="file" accept="image/*"><label class="mute" for="eb">Date de naissance</label><input id="eb" type="date" value="${me.birth_date||""}"><label class="mute" for="eg">Sexe</label><select id="eg"><option value="">—</option><option value="H" ${me.gender==="H"?"selected":""}>Homme</option><option value="F" ${me.gender==="F"?"selected":""}>Femme</option></select><label class="mute" for="ev">Confidentialité de mes statuts</label><select id="ev"><option value="friends" ${me.privacy!=="everyone"?"selected":""}>Mes amis seulement</option><option value="everyone" ${me.privacy==="everyone"?"selected":""}>Tout le monde</option></select><button data-act="saveme">Enregistrer</button></div>
 <button class="ghost" data-act="logout">Me déconnecter</button>`;
}
const _unused=()=>`<div class="card"><div class="row">${av(me.name)}<div class="grow"><b>${esc(me.name)}</b><div class="mute">${esc(me.country)}</div></div></div><br><button class="ghost" data-act="logout">Me déconnecter</button></div>`;

function openCall(room,audio){
 const name=encodeURIComponent(JSON.stringify(me.name));
 const w=window.open("https://meet.jit.si/"+encodeURIComponent(room)+"#"+(audio?"config.startWithVideoMuted=true&config.startAudioOnly=true&":"")+"userInfo.displayName="+name,"_blank","noopener");
 if(!w)toast("Autorise les fenêtres pop-up pour rejoindre l’appel");
}
document.addEventListener("click",async e=>{
 const t=e.target.closest("[data-tab],[data-act]");if(!t)return;
 if(t.dataset.tab){tab=t.dataset.tab;chat=null;render();return}
 const a=t.dataset.act,id=t.dataset.id;
 try{
  if(a==="switch"){mode=mode==="signup"?"login":"signup";render();return}
  if(a==="signup"||a==="login"){
   const email=$("#e").value.trim(),password=$("#p").value;
   if(!email||password.length<6){toast("Entre un email et un mot de passe de 6 caractères minimum");return}
   t.disabled=true;let r;
   if(a==="signup"){const name=$("#n").value.trim();if(!name){toast("Entre ton nom");t.disabled=false;return}
    r=await sb.auth.signUp({email,password,options:{data:{name,country:$("#c").value,lang}}})}
   else r=await sb.auth.signInWithPassword({email,password});
   if(r.error){t.disabled=false;return fail(r.error)}
   if(!r.data.session){t.disabled=false;toast("Compte créé. Connecte-toi maintenant.");mode="login";render();return}
   await loadMe(r.data.user);tab="feed";render();return}
  if(a==="chat"){chat={id,name:t.dataset.name};tab="chat";render();return}
  if(a==="back"){chat=null;render();return}
  if(a==="join"){openCall(t.dataset.room,t.dataset.audio==="true");return}
  if(a==="call"||a==="acall"){const au=a==="acall";
   const room="freebook-"+crypto.randomUUID();
   openCall(room,au);
   const r=await sb.from("messages").insert({receiver:chat.id,kind:"call",room,body:au?"Appel audio":"Appel vidéo"});
   if(r.error)throw r.error;render();return}
  if(a==="send"){const v=$("#mi").value.trim();if(!v)return;
   const r=await sb.from("messages").insert({receiver:chat.id,body:v});if(r.error)throw r.error;render();return}
  if(a==="saveme"){const name=$("#en").value.trim();if(!name){toast("Entre ton nom");return}
   const r=await sb.from("profiles").update({name,country:$("#ec").value,birth_date:$("#eb").value||null,gender:$("#eg").value||null,privacy:$("#ev").value,...(($("#ep").files[0])?{avatar_url:await upImg($("#ep").files[0])}:{})}).eq("id",me.id).select().single();
   if(r.error)throw r.error;me=r.data;toast("Profil mis à jour");render();return}
  if(a==="logout"){if(chan){sb.removeChannel(chan);chan=null}chat=null;await sb.auth.signOut();me=null;mode="login";render();return}
  if(a==="post"){const v=$("#st").value.trim();if(!v){toast("Écris quelque chose avant de publier");return}
   const r=await sb.from("posts").insert({body:v,image_url:await upImg($("#sp")?.files[0])});if(r.error)throw r.error;toast("Statut publié");render()}
  if(a==="like"){const r=t.dataset.liked==="true"?await sb.from("likes").delete().match({post_id:id,user_id:me.id}):await sb.from("likes").insert({post_id:id});if(r.error)throw r.error;render()}
  if(a==="add"){const r=await sb.from("friendships").insert({requester:me.id,receiver:id});if(r.error)throw r.error;toast("Demande envoyée");render()}
  if(a==="accept"){const r=await sb.from("friendships").update({status:"accepted"}).eq("id",id);if(r.error)throw r.error;toast("Ami ajouté");render()}
  if(a==="ad"){const ti=$("#at").value.trim(),bo=$("#ab").value.trim();if(!ti||!bo){toast("Ajoute un titre et un texte");return}
   const r=await sb.from("ads").insert({title:ti,body:bo,category:$("#ac").value,image_url:await upImg($("#ap")?.files[0])});if(r.error)throw r.error;toast("Annonce publiée");render()}
  if(a==="follow"){const r=await sb.from("follows").insert({followed:id});if(r.error)throw r.error;render()}
  if(a==="unfollow"){const r=await sb.from("follows").delete().match({follower:me.id,followed:id});if(r.error)throw r.error;render()}
  if(a==="delad"){const r=await sb.from("ads").delete().eq("id",id);if(r.error)throw r.error;render()}
 }catch(err){fail(err)}
});
boot();
</script>
</body>
</html>
